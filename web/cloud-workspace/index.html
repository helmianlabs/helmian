<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helmian Cloud Workspace</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#10151d; color:#edf3fb; } body { margin:0; background:radial-gradient(circle at top right,#1b3440,#10151d 46rem); min-height:100vh; } main { max-width:68rem; margin:0 auto; padding:2rem 1rem 4rem; } .card { background:#17202b; border:1px solid #344156; border-radius:.75rem; padding:1.25rem; box-shadow:0 .5rem 2rem #0004; } .header,.project-head,.toolbar { display:flex; gap:.75rem; justify-content:space-between; align-items:center; flex-wrap:wrap; } h1,h2,p { margin:0; } p { color:#b8c5d9; line-height:1.45; } .badge,.tag { border:1px solid #4e8791; color:#9ee8ed; border-radius:999px; padding:.28rem .5rem; font-size:.72rem; font-weight:700; } .toolbar { margin-top:1rem; } input,select,button { font:inherit; } input,select { border:1px solid #47566e; border-radius:.4rem; padding:.58rem; color:#edf3fb; background:#0d1119; min-width:13rem; } button { border:1px solid #4e8791; background:#1f6670; color:white; border-radius:.4rem; padding:.58rem .8rem; cursor:pointer; } button.secondary { background:transparent; } button[aria-pressed="true"] { background:#315d72; } button:disabled { opacity:.6; cursor:wait; } #project-list { display:grid; gap:.65rem; margin-top:1rem; } article { background:#0d1119; border:1px solid #344156; border-radius:.55rem; padding:.85rem; } article.selected { border-color:#9ee8ed; box-shadow:0 0 0 1px #9ee8ed; } .project-row { width:100%; text-align:left; background:transparent; border:0; padding:0; } .meta { color:#91a1b9; font-size:.82rem; margin-top:.4rem; } #registration { margin-top:1rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(10rem,1fr)); gap:.65rem; align-items:end; } label { display:grid; gap:.3rem; color:#b8c5d9; font-size:.8rem; } .notice { min-height:1.4rem; margin-top:.75rem; font-size:.85rem; } [hidden] { display:none !important; }
  </style>
</head>
<body><main><section class="card" aria-labelledby="workspace-heading">
  <div class="header"><div><h1 id="workspace-heading">Workspace projects</h1><p>Tenant project registry. Choosing a project selects its Cloud record; it does not open a local folder or execute work.</p></div><span id="project-count" class="badge">0 PROJECTS</span></div>
  <p id="workspace-status" class="notice" role="status" aria-live="polite">Loading Organization projects…</p>
  <div class="toolbar"><input id="project-search" maxlength="160" placeholder="Filter projects by name or key" aria-label="Filter projects by name or key"><div><button id="active-filter" type="button" aria-pressed="true">Active</button><button id="archived-filter" class="secondary" type="button" aria-pressed="false">Archived</button></div><button id="project-clear" class="secondary" type="button">Clear</button></div>
  <section id="project-list" aria-live="polite" aria-label="Workspace project shelf"></section>
  <form id="registration" hidden><label>Project key <input id="project-key" required maxlength="96" pattern="[a-z0-9][a-z0-9._:-]*" placeholder="driver-onboarding"></label><label>Display name <input id="project-name" required maxlength="160" placeholder="Driver onboarding"></label><label>Source <select id="project-source"><option value="cloud">Cloud</option><option value="desktop_mirror">Desktop mirror</option><option value="external">External</option></select></label><label>Default branch <input id="project-branch" required maxlength="160" value="main"></label><button id="project-save" type="submit">Register project</button></form>
</section></main><script src="/admin/workspace/app.js"></script></body></html>
