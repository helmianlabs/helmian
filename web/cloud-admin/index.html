<!doctype html><html lang="en"><meta charset="utf-8"><title>Helmian Cloud Admin</title><style>body{font:16px system-ui;margin:3rem;max-width:900px;background:#10141d;color:#e8edf5}button,select{padding:.55rem;margin:.25rem}pre{padding:1rem;background:#1c2431;overflow:auto}.note{color:#a9c7ff}</style><h1>Helmian Cloud Admin</h1><p class="note">Working sample mode: tenant controls, provider readiness, approvals, and audit posture. No provider connections or live actions are enabled.</p><label>Sample tenant <select id="tenant"><option value="acme-operations">Acme Operations</option><option value="northstar-logistics">Northstar Logistics</option></select></label><button id="load">Load control surface</button><button id="loads">Search sample DAT loads</button><pre id="result">Choose a sample action.</pre><script>const out=document.querySelector('#result'),tenant=document.querySelector('#tenant');async function show(path){const r=await fetch(path);out.textContent=JSON.stringify(await r.json(),null,2)}document.querySelector('#load').onclick=()=>show('/api/control-surface?tenant_id='+tenant.value+'&actor_role=admin');document.querySelector('#loads').onclick=()=>show('/api/sample-loads?tenant_id='+tenant.value+'&actor_role=admin&provider_id=dat&origin=Dallas%2C%20TX&equipment=dry_van');</script></html>
