<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helmian Cloud Admin</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 16px system-ui, sans-serif; margin: 3rem auto; max-width: 900px; padding: 0 1rem; background: #10141d; color: #e8edf5; }
    button { padding: .65rem 1rem; border: 0; border-radius: .35rem; background: #7db4ff; color: #09111d; font-weight: 700; cursor: pointer; }
    pre { padding: 1rem; background: #1c2431; overflow: auto; border-radius: .35rem; }
    .note { color: #a9c7ff; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Helmian Cloud Admin</h1>
  <p class="note">This is the live, read-only control surface. Sign in with your organization identity to view the tenant-scoped Neon and deployment status.</p>
  <section id="signed-out">
    <button id="login" type="button">Sign in with organization identity</button>
  </section>
  <section id="signed-in" hidden>
    <p id="actor"></p>
    <button id="refresh" type="button">Refresh control surface</button>
    <pre id="result">Loading…</pre>
  </section>
  <script src="/admin/assets/app.js"></script>
</body>
</html>
