# Builds the Helmian Windows desktop app and publishes a GitHub Release when a
# tag like v0.1.0 is pushed. Manual runs (workflow_dispatch) build and upload
# the installer as a workflow artifact only; they never publish a release.
#
# Code signing is optional: if the WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD
# secrets exist, the exes and installer are signed with signtool; otherwise the
# build is unsigned (SmartScreen will warn: "More info" -> "Run anyway").
name: desktop-release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      include_voice_models:
        description: 'Bundle Whisper + Kokoro models (~470 MB)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Voice models (optional)
        if: ${{ inputs.include_voice_models == true }}
        shell: pwsh
        run: ./desktop/scripts/get-voice-models.ps1

      - name: Build + smoke test desktop
        shell: pwsh
        run: dotnet run --project desktop/Helmion.Desktop.SmokeTests/Helmion.Desktop.SmokeTests.csproj --configuration Release

      - name: Publish (self-contained win-x64, runs packaged smoke tests)
        shell: pwsh
        run: ./desktop/scripts/publish.ps1

      - name: Sign executables (only if certificate secrets are configured)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like '*x64*' | Select-Object -Last 1
          Get-ChildItem artifacts/Helmion-Pilot-win-x64-self-contained -Filter *.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($_.Name)" }
          }
          Remove-Item $pfx

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\artifacts\Helmion-Pilot-win-x64-self-contained" desktop/installer/Helmian.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          Compress-Archive -Path artifacts/Helmion-Pilot-win-x64-self-contained/* -DestinationPath "artifacts/installer/Helmian-${{ steps.ver.outputs.version }}-win-x64-portable.zip"
          Get-FileHash artifacts/installer/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content artifacts/installer/SHA256SUMS.txt

      - name: Sign installer (only if certificate secrets are configured)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like '*x64*' | Select-Object -Last 1
          Get-ChildItem artifacts/installer -Filter *.exe | ForEach-Object { & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item $pfx

      - uses: actions/upload-artifact@v4
        with:
          name: helmian-windows-${{ steps.ver.outputs.version }}
          path: artifacts/installer/*

      - name: Publish GitHub Release (tags only)
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" artifacts/installer/* --title "Helmian $env:GITHUB_REF_NAME" --generate-notes --verify-tag
