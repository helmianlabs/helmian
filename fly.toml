app = "helmian-cloud"
primary_region = "den"

[build]
  dockerfile = "deploy/helmian-cloud/Dockerfile"

[env]
  PORT = "8080"
  HELMION_CLOUD_ENVIRONMENT = "production"
  HELMION_CORA_PROVIDER = "openai"
  HELMION_CORA_TIER = "standard"
  HELMION_CORA_PERMISSION = "ask"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
